<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | VPNexues</title>
  <link rel="icon" href="https://slnercwjkfacyrfhdsnp.supabase.co/storage/v1/object/public/javascript-assets/vp_favicon.ico" sizes="16x16">
  <link rel="stylesheet" href="assets-ui/css/font-awesome.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(160deg,#1a3a15 0%,#2d5a27 30%,#3d7a32 60%,#8bc34a 100%);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      padding:20px;
    }

    body::before{
      content:"";position:fixed;top:-80px;right:-80px;width:250px;height:250px;border-radius:50%;
      background:radial-gradient(circle,rgba(205,220,57,0.15),transparent 70%);
      animation:orbFloat 7s ease-in-out infinite;z-index:0;
    }
    body::after{
      content:"";position:fixed;bottom:-60px;left:-60px;width:200px;height:200px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,255,255,0.08),transparent 70%);
      animation:orbFloat 8s ease-in-out infinite reverse;z-index:0;
    }
    @keyframes orbFloat{
      0%,100%{transform:translate(0,0) scale(1);}
      50%{transform:translate(15px,-20px) scale(1.15);}
    }

    .auth-card{
      width:100%;max-width:420px;position:relative;z-index:1;
      border-radius:28px;overflow:hidden;
      box-shadow:0 32px 100px rgba(0,0,0,0.4),0 0 80px rgba(139,195,74,0.15);
      animation:cardIn .6s cubic-bezier(.175,.885,.32,1.275) both;
    }
    @keyframes cardIn{
      0%{transform:translateY(40px) scale(0.9);opacity:0;}
      100%{transform:translateY(0) scale(1);opacity:1;}
    }

    .auth-top{
      padding:28px 24px 32px;position:relative;overflow:hidden;
      background:linear-gradient(160deg,#1a3a15 0%,#2d5a27 50%,#3d7a32 100%);
    }
    .auth-top::before{
      content:"";position:absolute;inset:0;
      background:radial-gradient(circle at 80% 20%,rgba(205,220,57,0.2),transparent 60%);
      animation:meshGlow 5s ease-in-out infinite alternate;
    }
    @keyframes meshGlow{
      0%{opacity:0.5;transform:scale(1);}
      100%{opacity:1;transform:scale(1.1);}
    }

    .auth-brand{
      display:flex;align-items:center;gap:12px;margin-bottom:20px;
      position:relative;z-index:1;
    }
    .auth-logo{
      width:40px;height:40px;border-radius:50%;background:#fff;
      border:2px solid rgba(255,255,255,0.3);
      display:flex;align-items:center;justify-content:center;overflow:hidden;
      box-shadow:0 4px 20px rgba(0,0,0,0.25);
      animation:logoSpin .7s cubic-bezier(.175,.885,.32,1.275) both;animation-delay:.2s;
    }
    @keyframes logoSpin{
      0%{transform:scale(0) rotate(-180deg);opacity:0;}
      100%{transform:scale(1) rotate(0deg);opacity:1;}
    }
    .auth-logo img{width:100%;height:100%;object-fit:cover;}
    .auth-brand-name{font-size:18px;font-weight:700;color:#fff;letter-spacing:.3px;}

    .auth-heading{position:relative;z-index:1;}
    .auth-heading h2{
      font-size:26px;font-weight:800;color:#fff;line-height:1.2;margin:0;
      animation:fadeUp .5s ease both;animation-delay:.3s;
    }
    .auth-offer{
      display:inline-flex;align-items:center;gap:4px;
      background:linear-gradient(135deg,#FFD700,#FFC107);
      color:#1a3a15;font-size:10px;font-weight:800;padding:5px 12px;border-radius:14px;
      margin-top:10px;box-shadow:0 3px 16px rgba(255,215,0,0.5);
      animation:fadeUp .5s ease both;animation-delay:.4s;
    }
    .auth-heading p{
      color:rgba(255,255,255,0.85);font-size:14px;line-height:1.4;
      margin-top:8px;animation:fadeUp .5s ease both;animation-delay:.45s;
    }
    @keyframes fadeUp{
      0%{transform:translateY(14px);opacity:0;}
      100%{transform:translateY(0);opacity:1;}
    }

    .auth-body{
      background:linear-gradient(180deg,#ffffff 0%,#f8fffe 100%);
      border-radius:24px 24px 28px 28px;padding:28px 24px 20px;margin-top:-10px;
      position:relative;z-index:1;
    }

    .step-dots{
      display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:20px;
    }
    .step-dot{
      width:8px;height:8px;border-radius:50%;background:#E5E7EB;
      transition:all .35s cubic-bezier(.4,0,.2,1);
    }
    .step-dot.active{
      background:linear-gradient(135deg,#8bc34a,#cddc39);
      width:28px;border-radius:4px;box-shadow:0 2px 12px rgba(139,195,74,0.4);
    }
    .step-dot.done{background:#3d7a32;}

    .form-group{margin-bottom:16px;text-align:left;}
    .input-wrap{position:relative;display:flex;align-items:center;}
    .input-icon{
      position:absolute;left:14px;color:#9CA3AF;font-size:15px;
      pointer-events:none;transition:all .3s ease;z-index:1;
    }
    .input-wrap:focus-within .input-icon{color:#3d7a32;transform:scale(1.15);}
    .form-input{
      width:100%;padding:14px 14px 14px 42px;border:1.5px solid #E5E7EB;
      border-radius:12px;font-size:14px;font-weight:500;color:#111827;
      background:#F9FAFB;outline:none;transition:all .3s cubic-bezier(.4,0,.2,1);
    }
    .form-input:focus{
      border-color:#8bc34a;background:#fff;
      box-shadow:0 0 0 4px rgba(139,195,74,0.12);transform:translateY(-1px);
    }
    .form-input::placeholder{color:#9CA3AF;font-weight:400;}

    .phone-wrap{display:flex;gap:8px;}
    .phone-wrap .form-input{flex:1;}

    .country-select{
      display:flex;align-items:center;gap:6px;padding:0 12px;
      border:1.5px solid #E5E7EB;border-radius:12px;background:#F9FAFB;
      cursor:pointer;transition:all .3s ease;flex-shrink:0;
    }
    .country-select:hover{border-color:#8bc34a;}
    .country-select img{width:22px;height:16px;object-fit:cover;border-radius:2px;}
    .country-select span{font-size:14px;font-weight:700;color:#111827;}

    .otp-input{
      width:100%;padding:14px;border:1.5px solid #E5E7EB;
      border-radius:12px;font-size:22px;font-weight:700;color:#111827;
      background:#fff;outline:none;text-align:center;letter-spacing:6px;
      transition:all .3s cubic-bezier(.4,0,.2,1);
      -webkit-text-security:unset;text-security:unset;
      font-family:'SF Mono','Fira Code',monospace;
    }
    .otp-input:focus{
      border-color:#8bc34a;background:#fff;
      box-shadow:0 0 0 4px rgba(139,195,74,0.12);transform:translateY(-1px);
    }

    .send-otp-btn{
      padding:14px 18px;border:none;border-radius:12px;
      background:linear-gradient(135deg,#3d7a32,#8bc34a);
      color:#fff;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
      transition:all .3s cubic-bezier(.4,0,.2,1);
      box-shadow:0 4px 16px rgba(61,122,50,0.35);
    }
    .send-otp-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(61,122,50,0.45);}
    .send-otp-btn:active{transform:scale(0.97);}
    .send-otp-btn:disabled{background:#9CA3AF;cursor:not-allowed;transform:none;box-shadow:none;}

    .resend-row{display:flex;align-items:center;gap:8px;margin-top:6px;}
    .resend-btn{
      font-size:12px;color:#3d7a32;font-weight:600;cursor:pointer;
      background:none;border:none;padding:0;
    }
    .resend-btn:hover{text-decoration:underline;}
    .resend-btn:disabled{color:#9CA3AF;cursor:not-allowed;}
    .otp-timer{font-size:12px;color:#9CA3AF;font-weight:600;}

    .cta-btn{
      width:100%;padding:16px;border:none;border-radius:14px;
      background:linear-gradient(135deg,#2d5a27 0%,#3d7a32 50%,#8bc34a 100%);
      color:#fff;font-size:16px;font-weight:700;cursor:pointer;
      box-shadow:0 6px 28px rgba(61,122,50,0.4);
      transition:all .3s cubic-bezier(.4,0,.2,1);
      display:flex;align-items:center;justify-content:center;gap:8px;
      position:relative;overflow:hidden;margin-top:8px;
    }
    .cta-btn::before{
      content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
      transition:left .6s ease;
    }
    .cta-btn:hover::before{left:100%;}
    .cta-btn:hover{transform:translateY(-2px);box-shadow:0 10px 36px rgba(61,122,50,0.5);}
    .cta-btn:active{transform:translateY(0) scale(0.98);}
    .cta-btn:disabled{background:linear-gradient(135deg,#9CA3AF,#6B7280);cursor:not-allowed;transform:none;box-shadow:none;}

    .auth-switch{
      text-align:center;margin-top:16px;font-size:13px;color:#6B7280;font-weight:500;
    }
    .auth-switch a{color:#3d7a32;font-weight:700;cursor:pointer;text-decoration:none;}
    .auth-switch a:hover{text-decoration:underline;}

    .step{display:none;}
    .step.show{display:block;animation:fadeUp .4s ease both;}

    .toast{
      position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);
      background:#111827;color:#fff;padding:12px 24px;border-radius:12px;
      font-size:14px;font-weight:600;z-index:9999;opacity:0;
      transition:all .35s cubic-bezier(.4,0,.2,1);pointer-events:none;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    .back-link{
      position:fixed;top:20px;left:20px;z-index:10;
      width:40px;height:40px;border-radius:50%;
      background:rgba(255,255,255,0.12);border:none;
      color:#fff;display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:all .3s ease;font-size:16px;
    }
    .back-link:hover{background:rgba(255,255,255,0.25);transform:scale(1.1);}

    @media(max-width:420px){
      .auth-body{padding:22px 18px 16px;}
      .auth-top{padding:24px 18px 28px;}
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-link" aria-label="Go back"><i class="fas fa-chevron-left"></i></a>

  <div class="auth-card">
    <div class="auth-top">
      <div class="auth-brand">
        <div class="auth-logo">
          <img src="https://slnercwjkfacyrfhdsnp.supabase.co/storage/v1/object/public/javascript-assets/home-1/vp_logo.svg" onerror="this.onerror=null;this.src='assets-ui/img/home-1/vp_logo.svg'" alt="VPNexues">
        </div>
        <span class="auth-brand-name">VPNexues</span>
      </div>
      <div class="auth-heading">
        <h2>Welcome to VPNexues!</h2>
        <div class="auth-offer">FLAT &#x20B9;100 OFF</div>
        <p>Sign up now and get &#x20B9;100 off on your first order.</p>
      </div>
    </div>

    <div class="auth-body">
      <div class="step-dots">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
      </div>

      <!-- Step 1: Name, Email -->
      <div id="step1" class="step show">
        <div class="form-group">
          <div class="input-wrap">
            <i class="fas fa-user input-icon"></i>
            <input type="text" class="form-input" id="nameInput" placeholder="Full name" autocomplete="name">
          </div>
        </div>
        <div class="form-group">
          <div class="input-wrap">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" class="form-input" id="emailInput" placeholder="Email address" autocomplete="email">
          </div>
        </div>
        <button class="cta-btn" onclick="goStep2()">
          Continue
          <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <!-- Step 2: Phone + OTP -->
      <div id="step2" class="step">
        <div class="form-group">
          <div class="phone-wrap">
            <div class="country-select" id="countrySelect">
              <img id="countryFlag" src="https://slnercwjkfacyrfhdsnp.supabase.co/storage/v1/object/public/javascript-assets/in-flag.svg" alt="">
              <span id="countryDial">+91</span>
            </div>
            <div class="input-wrap" style="flex:1;">
              <i class="fas fa-phone input-icon"></i>
              <input type="tel" class="form-input" id="phoneInput" placeholder="Enter phone number" maxlength="15" autocomplete="tel" inputmode="tel">
            </div>
          </div>
        </div>
        <button class="cta-btn" id="sendOtpBtn" onclick="sendOtp()">
          Send OTP
          <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <div id="otpSection" style="display:none;margin-top:16px;">
          <div class="form-group">
            <div class="input-wrap">
              <i class="fas fa-shield-halved input-icon"></i>
              <input type="tel" class="otp-input" id="otpInput" placeholder="Enter OTP" maxlength="6" autocomplete="one-time-code" inputmode="numeric">
            </div>
            <div class="resend-row">
              <button class="resend-btn" id="resendBtn" onclick="sendOtp(true)" disabled>Resend OTP</button>
              <span class="otp-timer" id="otpTimer"></span>
            </div>
          </div>
          <button class="cta-btn" id="verifyBtn" onclick="verifyOtp()" disabled>
            Verify & Create Account
            <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M5 13L9 17L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <p class="auth-switch">Already have an account? <a href="index.html?login=1">Sign in</a></p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var generatedOtp = '';
    var otpTimerInterval = null;
    var userFullName = '';
    var userEmail = '';

    var _flagMap = {in:'in-flag.svg',us:'us flag.png',sg:'sg-flag.png',ae:'uae flag.png',gb:'us flag.png',au:'us flag.png',my:'sg-flag.png',sa:'uae flag.png'};
    var _flagBase = 'https://slnercwjkfacyrfhdsnp.supabase.co/storage/v1/object/public/javascript-assets';
    function _localFlag(code){ var f=_flagMap[code]; return f ? _flagBase+'/'+encodeURIComponent(f) : _flagBase+'/in-flag.svg'; }
    var COUNTRY_MAP = {
      IN: { dial: '+91', flag: 'in' },
      SG: { dial: '+65', flag: 'sg' },
      US: { dial: '+1', flag: 'us' },
      AE: { dial: '+971', flag: 'ae' }
    };

    function detectCountry() {
      var saved = localStorage.getItem('country');
      if (saved) {
        var c = COUNTRY_MAP[saved.toUpperCase()] || COUNTRY_MAP.IN;
        document.getElementById('countryDial').textContent = c.dial;
        document.getElementById('countryFlag').src = _localFlag(c.flag);
        return;
      }
      fetch('https://ipapi.co/json/')
        .then(function(r){ return r.json(); })
        .then(function(data){
          var code = (data.country_code || 'IN').toUpperCase();
          var c = COUNTRY_MAP[code] || COUNTRY_MAP.IN;
          document.getElementById('countryDial').textContent = c.dial;
          document.getElementById('countryFlag').src = _localFlag(c.flag);
          localStorage.setItem('country', code);
        })
        .catch(function(){});
    }

    window.addEventListener('pageshow', function(){
      var saved = localStorage.getItem('country');
      if (saved) {
        var c = COUNTRY_MAP[saved.toUpperCase()] || COUNTRY_MAP.IN;
        document.getElementById('countryDial').textContent = c.dial;
        document.getElementById('countryFlag').src = _localFlag(c.flag);
      }
    });

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function(){ t.classList.remove('show'); }, 3000);
    }

    function goStep2() {
      var name = document.getElementById('nameInput').value.trim();
      var email = document.getElementById('emailInput').value.trim();
      if (!name) { showToast('Enter your name'); return; }
      if (!email || !email.includes('@')) { showToast('Enter a valid email'); return; }
      userFullName = name;
      userEmail = email;
      document.getElementById('step1').classList.remove('show');
      document.getElementById('step2').classList.add('show');
      document.getElementById('dot1').classList.remove('active');
      document.getElementById('dot1').classList.add('done');
      document.getElementById('dot2').classList.add('active');
    }

    function sendOtp(isResend) {
      var phone = document.getElementById('phoneInput').value.replace(/\D/g, '');
      if (phone.length < 6) { showToast('Enter a valid phone number'); return; }

      generatedOtp = String(Math.floor(100000 + Math.random() * 900000));

      document.getElementById('otpSection').style.display = 'block';
      document.getElementById('otpInput').focus();
      document.getElementById('verifyBtn').disabled = true;

      showToast('Your OTP is: ' + generatedOtp);

      var seconds = 30;
      document.getElementById('resendBtn').disabled = true;
      document.getElementById('otpTimer').textContent = 'Resend in ' + seconds + 's';
      if (otpTimerInterval) clearInterval(otpTimerInterval);
      otpTimerInterval = setInterval(function(){
        seconds--;
        if (seconds <= 0) {
          clearInterval(otpTimerInterval);
          document.getElementById('resendBtn').disabled = false;
          document.getElementById('otpTimer').textContent = '';
        } else {
          document.getElementById('otpTimer').textContent = 'Resend in ' + seconds + 's';
        }
      }, 1000);
    }

    document.getElementById('otpInput').addEventListener('input', function(){
      this.value = this.value.replace(/[^0-9]/g, '');
      document.getElementById('verifyBtn').disabled = this.value.length !== 6;
    });

    document.getElementById('phoneInput').addEventListener('input', function(){
      this.value = this.value.replace(/[^0-9]/g, '');
    });

    function verifyOtp() {
      var otp = document.getElementById('otpInput').value.trim();
      if (otp !== generatedOtp) {
        showToast('Invalid OTP. Please try again.');
        document.getElementById('otpInput').value = '';
        document.getElementById('verifyBtn').disabled = true;
        return;
      }

      var phone = document.getElementById('phoneInput').value.replace(/\D/g, '');
      var dial = document.getElementById('countryDial').textContent;

      localStorage.setItem('vpnexuesAuth', 'true');
      localStorage.setItem('vpnexuesLoggedIn', 'true');
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('vpnexuesUser', JSON.stringify({
        name: userFullName, email: userEmail, mobile: phone, phone: phone, dialCode: dial
      }));
      localStorage.setItem('vpnexues_userName', userFullName);
      localStorage.setItem('vpnexues_userEmail', userEmail);
      localStorage.setItem('vpnexues_userMobile', phone);

      showToast('Account created successfully!');
      setTimeout(function(){
        window.location.href = 'index.html';
      }, 1000);
    }

    detectCountry();
  </script>

<script id="broken-image-hide">document.addEventListener("error",function(e){if(e.target.tagName==="IMG"){e.target.style.setProperty("display","none","important");var c=e.target.closest(".bb-item-img,.box-icon-only,.bb-mobile-image-wrap,.sb-mobile-product-card,.prd-img,.product-image,.image-box");if(c){c.classList.add("img-load-failed");var ic=c.querySelector(".box-product-icon");if(ic){ic.style.setProperty("display","flex","important");ic.style.alignItems="center";ic.style.justifyContent="center";ic.style.width="100%";ic.style.height="100%";ic.style.fontSize="44px";}}}},true);</script>
</body>
</html>
