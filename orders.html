<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14532d">
  <title>My Orders | VPNexues</title>
  <script>
    (function () {
      var authKeys = ["vpnexuesAuth", "vpnexuesLoggedIn", "vpnexuesSession", "vpnexuesUser", "isLoggedIn", "loggedInUser", "authToken", "userToken", "currentUser"];
      var isLoggedIn = authKeys.some(function (key) {
        return localStorage.getItem(key) === "true" || sessionStorage.getItem(key) === "true";
      });
      if (!isLoggedIn) {
        window.location.replace("index.html?login=1");
      }
    })();
  </script>
  <link rel="icon" href="https://slnercwjkfacyrfhdsnp.supabase.co/storage/v1/object/public/javascript-assets/vp_favicon.ico" sizes="16x16">
  <link rel="stylesheet" href="assets-ui/css/font-awesome.min.css?v=1.0">
  <link rel="stylesheet" href="assets-ui/css/mobile-bottom-nav.css?v=1.2">
  <style>
    /* ══════════════════════════════════════════════════════════════
       VPNexues — My Account (app shell)
       ══════════════════════════════════════════════════════════════ */
    :root {
      --acc-forest: #14532d;
      --acc-forest-dark: #0f3d22;
      --acc-leaf: #2f7d2c;
      --acc-sage: #5b8c51;
      --acc-gold: #ffdc3c;
      --acc-ink: #1a1a1a;
      --acc-muted: #6b7280;
      --acc-line: rgba(21, 83, 45, .12);
      --acc-paper: #ffffff;
      --acc-danger: #b42318;
      --acc-radius: 14px;
      --acc-shadow: 0 4px 12px rgba(21, 102, 39, .08);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scrollbar-gutter: stable; }

    body.account-page {
      min-height: 100vh;
      margin: 0;
      color: var(--acc-ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      background: linear-gradient(180deg, #e8f5e3 0%, #f4f9f2 100%);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }

    :focus-visible { outline: 2px solid var(--acc-leaf); outline-offset: 2px; }

    .acc-app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 0 16px 36px;
    }

    /* ── Sticky top bar ─────────────────────────────────────────── */
    .acc-topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) 40px;
      align-items: center;
      gap: 12px;
      width: 100vw;
      margin-left: calc(-50vw + 50%);
      padding: 14px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .acc-icon-btn {
      position: relative;
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: grid;
      place-items: center;
      border: 1.5px solid rgba(91, 140, 81, .28);
      border-radius: 50%;
      background: linear-gradient(145deg, #f4fbf1 0%, #e8f5e3 100%);
      color: #2f7d2c;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(21, 102, 39, .1), inset 0 1px 0 rgba(255, 255, 255, .9), inset 0 -1px 0 rgba(91, 140, 81, .06);
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }

    .acc-icon-btn:hover {
      border-color: rgba(91, 140, 81, .5);
      box-shadow: 0 6px 16px rgba(21, 102, 39, .16), inset 0 1px 0 #fff;
      transform: translateY(-1px);
    }

    .acc-icon-btn:active { transform: translateY(0); }

    /* Back button — solid dark green (cart button keeps the light style) */
    .acc-topbar > .acc-icon-btn {
      border-color: #14532d;
      background: #14532d;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(20, 83, 45, .28), inset 0 1px 0 rgba(255, 255, 255, .14);
    }
    .acc-topbar > .acc-icon-btn:hover {
      border-color: #0f3d22;
      background: #0f3d22;
      box-shadow: 0 6px 16px rgba(20, 83, 45, .34), inset 0 1px 0 rgba(255, 255, 255, .14);
    }
    .acc-topbar > .acc-icon-btn:active {
      background: #0b2e19;
      box-shadow: 0 2px 6px rgba(20, 83, 45, .3), inset 0 1px 2px rgba(0, 0, 0, .18);
    }

    .acc-cart-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--acc-gold);
      color: var(--acc-forest);
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      box-shadow: 0 0 0 2px #fff;
    }

    .acc-icon-btn i { display: inline-block; line-height: 1; }
    .acc-topbar__actions { display: flex; justify-content: flex-end; gap: 8px; }

    .acc-topbar__title { min-width: 0; text-align: center; }
    .acc-topbar__title strong {
      display: block;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -.01em;
      color: var(--acc-ink);
    }

    /* ── Profile hero ───────────────────────────────────────────── */
    .acc-main { padding-top: 18px; }

    .acc-hero {
      position: relative;
      overflow: hidden;
      padding: 20px;
      border-radius: 22px;
      color: #fff;
      background: linear-gradient(135deg, #12462c 0%, #17623a 55%, #1f7a46 100%);
      box-shadow: 0 14px 28px rgba(20, 83, 45, .2);
    }

    .acc-hero::before,
    .acc-hero::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, .06);
      pointer-events: none;
    }
    .acc-hero::before { width: 160px; height: 160px; top: -80px; right: -50px; }
    .acc-hero::after { width: 100px; height: 100px; bottom: -55px; left: -30px; }

    .acc-hero__leaf {
      position: absolute;
      right: -12px;
      bottom: -24px;
      font-size: 112px;
      line-height: 1;
      color: rgba(255, 255, 255, .055);
      transform: rotate(-18deg);
      pointer-events: none;
    }

    .acc-hero__row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .acc-avatar {
      width: 56px;
      height: 56px;
      flex: 0 0 56px;
      display: grid;
      place-items: center;
      border-radius: 17px;
      background: linear-gradient(145deg, #ffdc3c, #f4b523);
      color: var(--acc-forest);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.02em;
      box-shadow: 0 8px 18px rgba(0, 0, 0, .16), inset 0 1px 0 rgba(255, 255, 255, .6);
    }
    .acc-avatar img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: inherit;
    }

    .acc-hero__text { flex: 1; min-width: 0; }
    .acc-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .68);
    }
    .acc-hero h1 {
      margin: 3px 0 2px;
      font-size: 19px;
      font-weight: 750;
      line-height: 1.2;
      letter-spacing: -.02em;
      overflow-wrap: anywhere;
    }
    .acc-hero p {
      margin: 0;
      font-size: 12.5px;
      color: rgba(255, 255, 255, .75);
      overflow-wrap: anywhere;
    }

    .acc-edit {
      align-self: flex-start;
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, .26);
      border-radius: 999px;
      background: rgba(255, 255, 255, .12);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }
    .acc-edit:hover { background: rgba(255, 255, 255, .22); transform: translateY(-1px); }

    /* ── Overview stats ─────────────────────────────────────────── */
    .acc-stats {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      margin: 14px 0 0;
    }

    .acc-stat {
      display: block;
      padding: 11px 6px;
      border: 1px solid var(--acc-line);
      border-radius: 15px;
      background: var(--acc-paper);
      text-align: center;
      box-shadow: var(--acc-shadow);
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .acc-stat:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(20, 83, 45, .12); }
    .acc-stat strong {
      display: block;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.1;
      color: var(--acc-forest);
    }
    .acc-stat span { display: block; margin-top: 3px; font-size: 11px; font-weight: 600; color: var(--acc-muted); }

    /* ── Sections & cards ───────────────────────────────────────── */
    .acc-section { margin-top: 22px; }

    .acc-section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 0 2px 10px;
    }
    .acc-section-head h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -.01em;
      color: var(--acc-ink);
    }
    .acc-section-head a { font-size: 12px; font-weight: 700; color: var(--acc-leaf); }
    .acc-section-head a:hover { text-decoration: underline; }

    .acc-card {
      overflow: hidden;
      border: 1px solid var(--acc-line);
      border-radius: var(--acc-radius);
      background: var(--acc-paper);
      box-shadow: var(--acc-shadow);
    }

    /* Quick action tiles */
    .acc-quick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

    .acc-quick {
      --acc-quick-pad: 13px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
      min-height: 104px;
      padding: var(--acc-quick-pad);
      border: 1px solid var(--acc-line);
      border-radius: var(--acc-radius);
      background: var(--acc-paper);
      box-shadow: var(--acc-shadow);
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .acc-quick:hover {
      border-color: rgba(91, 140, 81, .45);
      box-shadow: 0 10px 22px rgba(20, 83, 45, .12);
      transform: translateY(-2px);
    }
    .acc-quick__icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      font-size: 16px;
    }
    .acc-quick strong { display: block; font-size: 13.5px; font-weight: 700; }
    .acc-quick small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--acc-muted); }
    .acc-quick__arrow {
      position: absolute;
      top: var(--acc-quick-pad);
      right: var(--acc-quick-pad);
      height: 38px;
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      line-height: 1;
      color: #b3c0b4;
    }

    .acc-tint--green  { background: #eaf5e8; color: var(--acc-leaf); }
    .acc-tint--blue   { background: #e8f1fb; color: #2563eb; }
    .acc-tint--teal   { background: #e5f6f1; color: #0d9488; }
    .acc-tint--purple { background: #f0ebfb; color: #7c3aed; }
    .acc-tint--amber  { background: #fff5dc; color: #b7791f; }
    .acc-tint--red    { background: #fdecea; color: var(--acc-danger); }

    /* List rows */
    .acc-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 70px;
      padding: 11px 14px;
      border: 0;
      border-bottom: 1px solid var(--acc-line);
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background .2s ease;
    }
    .acc-row:last-child { border-bottom: 0; }
    .acc-row:hover { background: #f7fbf6; }
    .acc-row--static { cursor: default; }

    .acc-row__icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      font-size: 16px;
    }
    .acc-row__text { flex: 1; min-width: 0; }
    .acc-row__text strong { display: block; font-size: 14px; font-weight: 700; line-height: 1.25; }
    .acc-row__text small { display: block; margin-top: 3px; font-size: 11.5px; color: var(--acc-muted); }
    .acc-row__arrow {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      line-height: 1;
      color: #a8b6a9;
    }

    .acc-row--danger .acc-row__text strong { color: var(--acc-danger); }
    .acc-row--danger:hover { background: #fff7f6; }

    /* Toggle rows */
    .acc-toggle {
      position: relative;
      width: 44px;
      height: 26px;
      flex: 0 0 44px;
    }
    .acc-toggle input { position: absolute; width: 0; height: 0; opacity: 0; }
    .acc-toggle span {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: #d7ded7;
      cursor: pointer;
      transition: background .25s ease;
    }
    .acc-toggle span::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, .18);
      transition: transform .25s cubic-bezier(.34, 1.56, .64, 1);
    }
    .acc-toggle input:checked + span { background: linear-gradient(135deg, var(--acc-leaf), var(--acc-sage)); }
    .acc-toggle input:checked + span::before { transform: translateX(18px); }
    .acc-toggle input:focus-visible + span { outline: 2px solid var(--acc-forest); outline-offset: 2px; }

    /* Logout & footer */
    .acc-logout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: 1.5px solid var(--acc-forest);
      border-radius: 15px;
      background: var(--acc-forest);
      color: #fff;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(20, 83, 45, .18);
      transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    .acc-logout:hover {
      background: var(--acc-forest-dark);
      box-shadow: 0 10px 22px rgba(20, 83, 45, .24);
      transform: translateY(-2px);
    }
    .acc-logout:active { transform: translateY(0); }

    .acc-footnote { margin: 22px 0 4px; text-align: center; font-size: 11px; color: #8a968b; }
    .acc-footnote strong { color: var(--acc-leaf); }

    /* ── Sidebar navigation & detail views ──────────────────────── */
    .acc-nav { display: grid; gap: 6px; margin: 16px 0 0; }

    .acc-nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 44px;
      padding: 10px 13px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      color: #4b5563;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }
    .acc-nav-item > i:first-child { width: 18px; flex: 0 0 18px; text-align: center; font-size: 14px; }
    .acc-nav-item:hover { background: #f1f6f0; color: var(--acc-forest); }
    .acc-nav-item.active {
      border-color: var(--acc-forest);
      background: var(--acc-forest);
      color: #fff;
      box-shadow: 0 6px 14px rgba(20, 83, 45, .18);
    }
    .acc-nav-caret {
      display: inline-flex;
      align-items: center;
      margin-left: auto;
      font-size: 11px;
      line-height: 1;
      transition: transform .2s ease;
    }
    .acc-nav-toggle[aria-expanded="true"] .acc-nav-caret { transform: rotate(90deg); }
    .acc-nav-toggle.open-group { color: var(--acc-forest); }
    .acc-nav-toggle.open-group.active { background: #e8f3e7; border-color: transparent; color: var(--acc-forest); box-shadow: none; }

    .acc-nav-group { display: grid; gap: 3px; }
    .acc-subnav {
      display: grid;
      gap: 2px;
      margin: 2px 0 6px 22px;
      padding-left: 12px;
      border-left: 2px solid var(--acc-line);
    }
    .acc-subnav[hidden] { display: none; }
    .acc-subitem {
      display: block;
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #5b6b5e;
      font-size: 12.5px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: background .2s ease, color .2s ease;
    }
    .acc-subitem:hover { background: #f1f6f0; color: var(--acc-forest); }
    .acc-subitem.active { background: #e8f3e7; color: var(--acc-forest); font-weight: 750; }

    .acc-view[hidden], .acc-detail[hidden] { display: none; }
    .acc-view, .acc-detail { animation: accFadeIn .28s ease both; }
    @keyframes accFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .acc-view-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .acc-view-kicker {
      display: block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--acc-leaf);
    }
    .acc-view-head h2 {
      margin: 3px 0 0;
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -.02em;
    }
    .acc-view-link {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      line-height: 1.2;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--acc-leaf);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .acc-view-link:hover { text-decoration: underline; }
    .acc-note { margin: 12px 2px 0; font-size: 12px; color: var(--acc-muted); }
    .acc-view .acc-section { margin-top: 20px; }

    /* Detail cards */
    .acc-detail-card { padding: 4px 14px; }
    .acc-detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--acc-line);
      font-size: 13px;
    }
    .acc-detail-row:last-child { border-bottom: 0; }
    .acc-detail-row span { color: var(--acc-muted); }
    .acc-detail-row strong { font-weight: 700; text-align: right; overflow-wrap: anywhere; }
    .acc-detail-desc {
      margin: 0;
      padding: 12px 0;
      border-bottom: 1px solid var(--acc-line);
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--acc-muted);
    }
    .acc-pref-channels { display: grid; gap: 8px; padding: 14px 0; }
    .acc-pref-channel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 11px;
      border: 1px solid var(--acc-line);
      border-radius: 11px;
      background: var(--acc-paper);
      font-size: 12.5px;
      font-weight: 600;
    }
    .acc-address-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--acc-line);
      font-size: 13px;
    }
    .acc-address-item:last-child { border-bottom: 0; }
    .acc-address-item i { color: var(--acc-leaf); }
    .acc-address-item span { flex: 1; }
    .acc-detail-empty { padding: 22px 0; text-align: center; font-size: 12.5px; color: var(--acc-muted); }

    /* ── Order tracker ──────────────────────────────────────────── */
    .trk-card { padding: 16px; }
    .trk-card + .trk-card { margin-top: 14px; }
    .trk-label {
      display: block;
      margin-bottom: 7px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--acc-muted);
    }
    .trk-search { display: flex; gap: 8px; }
    .trk-input {
      flex: 1;
      min-width: 0;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--acc-line);
      border-radius: 12px;
      background: #fff;
      color: var(--acc-ink);
      font: inherit;
      font-size: 13px;
    }
    .trk-input:focus { outline: none; border-color: var(--acc-leaf); box-shadow: 0 0 0 3px rgba(47, 125, 44, .12); }
    .trk-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 42px;
      padding: 10px 16px;
      border: 1px solid var(--acc-forest);
      border-radius: 12px;
      background: var(--acc-forest);
      color: #fff;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }
    .trk-btn:hover { background: var(--acc-forest-dark); transform: translateY(-1px); }
    .trk-hint { margin: 9px 0 0; font-size: 11.5px; color: var(--acc-muted); }

    .trk-headline { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .trk-id { font-size: 12px; color: var(--acc-muted); }
    .trk-id strong { display: block; margin-top: 2px; font-size: 15px; font-weight: 800; color: var(--acc-ink); overflow-wrap: anywhere; }
    .trk-badge {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e8f3e7;
      color: var(--acc-forest);
      font-size: 11.5px;
      font-weight: 800;
    }
    .trk-badge i { font-size: 9px; }
    .trk-badge--cancelled { background: #fdecea; color: var(--acc-danger); }

    .trk-progress { height: 7px; margin: 16px 0 7px; border-radius: 999px; background: #e8eee9; overflow: hidden; }
    .trk-progress__bar {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--acc-leaf), #7cb85e);
      transition: width .4s ease;
    }
    .trk-progress-label { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: var(--acc-muted); }

    .trk-summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 16px; }
    .trk-meta { padding: 10px 11px; border: 1px solid var(--acc-line); border-radius: 12px; background: #fbfdfb; }
    .trk-meta span {
      display: block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--acc-muted);
    }
    .trk-meta strong { display: block; margin-top: 4px; font-size: 12.5px; font-weight: 750; overflow-wrap: anywhere; }

    .trk-card-title { display: flex; align-items: center; gap: 8px; margin: 20px 0 4px; font-size: 14px; font-weight: 750; }
    .trk-card-title i { color: var(--acc-leaf); }

    .trk-timeline { list-style: none; margin: 0; padding: 12px 0 0; }
    .trk-step { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding-bottom: 22px; }
    .trk-step:last-child { padding-bottom: 0; }
    .trk-step::before {
      content: '';
      position: absolute;
      left: 16px;
      top: 34px;
      bottom: -2px;
      width: 2px;
      background: var(--acc-line);
    }
    .trk-step:last-child::before { display: none; }
    .trk-step.done::before { background: var(--acc-leaf); }
    .trk-step__dot {
      position: relative;
      z-index: 1;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 2px solid var(--acc-line);
      border-radius: 50%;
      background: #fff;
      color: #9aa79d;
      font-size: 13px;
    }
    .trk-step.done .trk-step__dot { border-color: var(--acc-leaf); background: var(--acc-leaf); color: #fff; }
    .trk-step.current .trk-step__dot {
      border-color: var(--acc-leaf);
      background: #fff;
      color: var(--acc-leaf);
      box-shadow: 0 0 0 4px rgba(47, 125, 44, .12);
    }
    .trk-step__title { font-size: 13.5px; font-weight: 750; }
    .trk-step.current .trk-step__title { color: var(--acc-leaf); }
    .trk-step__time { margin-top: 2px; font-size: 11.5px; color: var(--acc-muted); }
    .trk-step__note { margin-top: 5px; font-size: 12px; line-height: 1.5; color: var(--acc-muted); }

    .trk-help {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
      padding: 12px 13px;
      border: 1px solid var(--acc-line);
      border-radius: 12px;
      background: linear-gradient(135deg, #f3f9f1, #fff);
      font-size: 12px;
    }
    .trk-help a {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 750;
      color: var(--acc-leaf);
    }
    .trk-help a i { font-size: 10px; line-height: 1; }

    @media (max-width: 359px) {
      .trk-search { flex-wrap: wrap; }
      .trk-btn { width: 100%; }
      .trk-summary { grid-template-columns: 1fr; }
      .trk-help { flex-direction: column; align-items: flex-start; }
    }

    /* ── Payments ───────────────────────────────────────────────── */
    .pay-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
    .pay-stat {
      padding: 12px 8px;
      border: 1px solid var(--acc-line);
      border-radius: 14px;
      background: var(--acc-paper);
      box-shadow: var(--acc-shadow);
      text-align: center;
    }
    .pay-stat i { display: block; margin-bottom: 6px; font-size: 15px; color: var(--acc-leaf); }
    .pay-stat strong { display: block; font-size: 15px; font-weight: 800; color: var(--acc-forest); }
    .pay-stat span { display: block; margin-top: 2px; font-size: 10px; color: var(--acc-muted); }

    .pay-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 20px 0 10px; }
    .pay-head h3 { margin: 0; font-size: 14px; font-weight: 750; }
    .pay-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 11px;
      border: 1px solid var(--acc-line);
      border-radius: 10px;
      background: #f7faf6;
      color: var(--acc-leaf);
      font-size: 11.5px;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease;
    }
    .pay-action i { line-height: 1; }
    .pay-action:hover { border-color: var(--acc-leaf); background: #eef6ec; }
    .pay-action--solid { border-color: var(--acc-forest); background: var(--acc-forest); color: #fff; }
    .pay-action--solid:hover { border-color: var(--acc-forest-dark); background: var(--acc-forest-dark); }

    .pay-methods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .pay-method { padding: 14px; border: 1px solid var(--acc-line); border-radius: 14px; background: linear-gradient(145deg, #f9fcf8, #fff); }
    .pay-method.is-default { border-color: rgba(47, 125, 44, .35); }
    .pay-method__top { display: flex; align-items: center; gap: 10px; }
    .pay-method__icon {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #e8f1fb;
      color: #2563eb;
      font-size: 15px;
    }
    .pay-method__name { min-width: 0; font-size: 12.5px; font-weight: 750; overflow-wrap: anywhere; }
    .pay-method__sub { margin-top: 2px; font-size: 11px; color: var(--acc-muted); overflow-wrap: anywhere; }
    .pay-default {
      margin-left: auto;
      flex: 0 0 auto;
      padding: 4px 7px;
      border-radius: 999px;
      background: #e8f3e7;
      color: var(--acc-forest);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .pay-method__actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .pay-link { padding: 0; border: 0; background: none; color: var(--acc-leaf); font-size: 11.5px; font-weight: 750; cursor: pointer; }
    .pay-link:hover { text-decoration: underline; }
    .pay-link--muted { color: var(--acc-muted); }

    .pay-add-form {
      display: none;
      gap: 8px;
      margin-top: 10px;
      padding: 12px;
      border: 1px solid var(--acc-line);
      border-radius: 12px;
      background: #fbfdfb;
    }
    .pay-add-form.open { display: grid; }
    .pay-add-form input, .pay-add-form select {
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid var(--acc-line);
      border-radius: 9px;
      background: #fff;
      color: var(--acc-ink);
      font: inherit;
      font-size: 12.5px;
    }
    .pay-add-form input:focus, .pay-add-form select:focus { outline: none; border-color: var(--acc-leaf); }
    .pay-add-actions { display: flex; gap: 8px; }
    .pay-add-actions .pay-action { flex: 1; }

    .pay-transactions { display: grid; gap: 8px; }
    .pay-tx { display: flex; align-items: center; gap: 11px; padding: 11px 12px; border: 1px solid var(--acc-line); border-radius: 12px; background: #fff; }
    .pay-tx__icon { width: 34px; height: 34px; flex: 0 0 34px; display: grid; place-items: center; border-radius: 10px; background: #eaf5e8; color: var(--acc-leaf); font-size: 14px; }
    .pay-tx__body { flex: 1; min-width: 0; }
    .pay-tx__title { font-size: 12.5px; font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pay-tx__meta { margin-top: 2px; font-size: 11px; color: var(--acc-muted); }
    .pay-tx__right { flex: 0 0 auto; text-align: right; }
    .pay-tx__amount { font-size: 12.5px; font-weight: 800; }
    .pay-status { display: inline-block; margin-top: 3px; padding: 3px 7px; border-radius: 999px; background: #e8f3e7; color: var(--acc-forest); font-size: 9.5px; font-weight: 800; }
    .pay-status--pending { background: #fff5dc; color: #b7791f; }
    .pay-status--failed { background: #fdecea; color: var(--acc-danger); }
    .pay-empty { padding: 20px 14px; border: 1px dashed rgba(21, 83, 45, .2); border-radius: 14px; text-align: center; font-size: 12px; color: var(--acc-muted); }
    .pay-empty i { display: block; margin-bottom: 7px; font-size: 20px; color: #a9bda9; }
    .pay-note { margin: 10px 2px 0; font-size: 11.5px; color: var(--acc-muted); }

    @media (max-width: 359px) {
      .pay-summary, .pay-methods { grid-template-columns: 1fr; }
    }

    /* ── Wishlist panel ─────────────────────────────────────────── */
    .acc-panel[hidden] { display: none; }
    .acc-panel {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: end center;
      padding: 16px;
      background: rgba(10, 28, 16, .55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .acc-panel__card,
    .acc-modal {
      width: min(480px, 100%);
      max-height: 86dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 22px 22px 0 0;
      background: var(--acc-paper);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, .2);
      animation: accSlideUp .3s cubic-bezier(.25, .46, .45, .94);
    }
    .acc-grab { width: 38px; height: 4px; margin: 10px auto 0; border-radius: 999px; background: #d7ded7; }

    .acc-panel__head,
    .acc-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--acc-line);
    }
    .acc-panel__head h2,
    .acc-modal-header h2 { margin: 0; font-size: 18px; font-weight: 750; letter-spacing: -.01em; }

    .acc-modal-close,
    .wishlist-panel__dialog header button {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: grid;
      place-items: center;
      border: 1px solid var(--acc-line);
      border-radius: 50%;
      background: #fff;
      color: var(--acc-muted);
      font-size: 15px;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }
    .acc-modal-close:hover,
    .wishlist-panel__dialog header button:hover { background: #f1f5f1; transform: rotate(90deg); }

    .wishlist-panel__items {
      display: grid;
      gap: 10px;
      padding: 16px 20px 22px;
      overflow-y: auto;
    }
    .wishlist-item {
      display: grid;
      grid-template-columns: 60px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border: 1px solid var(--acc-line);
      border-radius: 14px;
    }
    .wishlist-item img {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      object-fit: cover;
      background: #eef5ee;
    }
    .wishlist-item strong { display: block; font-size: 13.5px; line-height: 1.3; }
    .wishlist-item small { display: block; margin-top: 3px; font-size: 12px; color: var(--acc-muted); }
    .wishlist-item__remove {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(180, 35, 24, .18);
      border-radius: 50%;
      background: #fdecea;
      color: var(--acc-danger);
      font-size: 13px;
      cursor: pointer;
      transition: background .2s ease, color .2s ease, transform .2s ease;
    }
    .wishlist-item__remove:hover { background: var(--acc-danger); color: #fff; transform: scale(1.08); }
    .wishlist-empty { padding: 26px 10px; text-align: center; font-size: 13px; color: var(--acc-muted); }

    /* ── Delete-account sheet ───────────────────────────────────── */
    .acc-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1100;
      align-items: end;
      justify-content: center;
      padding: 16px;
      background: rgba(10, 28, 16, .58);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .acc-modal-overlay.open { display: flex; }
    .acc-modal { max-height: 90dvh; }

    .acc-modal-body { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px; }
    .acc-modal-desc { margin: 0 0 14px; font-size: 13px; line-height: 1.6; color: var(--acc-muted); }

    .acc-reasons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .acc-reason {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 9px 10px;
      border: 1px solid var(--acc-line);
      border-radius: 12px;
      background: #fff;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.25;
      cursor: pointer;
      transition: border-color .2s ease, background .2s ease;
    }
    .acc-reason:hover { border-color: rgba(91, 140, 81, .5); background: #f7fbf6; }
    .acc-reason input { width: 16px; height: 16px; flex: 0 0 16px; margin: 0; accent-color: var(--acc-leaf); }
    .acc-reason:has(input:checked) { border-color: var(--acc-leaf); background: #eef7ed; color: var(--acc-forest); }
    .acc-reason--wide { grid-column: 1 / -1; }

    .acc-reason-textarea {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--acc-line);
      border-radius: 12px;
      font: inherit;
      font-size: 13px;
      resize: vertical;
      outline: none;
    }
    .acc-reason-textarea:focus { border-color: var(--acc-leaf); box-shadow: 0 0 0 3px rgba(47, 125, 44, .12); }
    .acc-reason-textarea::placeholder { color: #9ca3af; }

    .acc-modal-footer {
      display: flex;
      gap: 10px;
      flex: 0 0 auto;
      padding: 14px 20px 20px;
      border-top: 1px solid var(--acc-line);
    }
    .acc-modal-cancel,
    .acc-modal-confirm {
      flex: 1;
      padding: 13px 10px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }
    .acc-modal-cancel { border: 1px solid var(--acc-line); background: #fff; color: #374151; }
    .acc-modal-cancel:hover { background: #f4f6f4; }
    .acc-modal-confirm { border: 1px solid var(--acc-danger); background: var(--acc-danger); color: #fff; }
    .acc-modal-confirm:hover { background: #991b1b; transform: translateY(-1px); }

    @keyframes accSlideUp {
      from { opacity: 0; transform: translateY(36px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      .acc-hero { padding: 16px; }
      .acc-hero__row { gap: 10px; }
      .acc-avatar {
        width: 44px;
        height: 44px;
        flex-basis: 44px;
        border-radius: 14px;
        font-size: 16px;
      }
      .acc-hero h1 { font-size: 16px; }
      .acc-hero p { font-size: 11.5px; }
      .acc-edit { padding: 5px 8px; font-size: 10px; }
    }

    /* ── Responsive layouts ─────────────────────────────────────── */
    @media (min-width: 600px) {
      .acc-app { max-width: 560px; padding: 0 24px 44px; }
      .acc-topbar { padding: 18px 16px; }
      .acc-hero { padding: 24px; }
      .acc-hero h1 { font-size: 21px; }
      .acc-quick { --acc-quick-pad: 15px; min-height: 112px; }
    }

    @media (min-width: 768px) {
      .acc-app { max-width: 760px; }
      .acc-quick-grid { gap: 14px; }
      .acc-quick { min-height: 116px; }
      .acc-row { min-height: 74px; }
    }

    @media (min-width: 1025px) {
      .acc-app {
        max-width: 1120px;
        padding: 0 32px 60px;
      }
      .acc-topbar { padding: 18px 16px; }
      .acc-main { padding-top: 26px; }

      .acc-layout {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 30px;
        align-items: start;
      }
      .acc-side { position: sticky; top: 92px; }
      .acc-hero { padding: 24px; }
      .acc-nav { margin-top: 18px; }

      .acc-content { display: block; }
      .acc-view-head h2 { font-size: 21px; }
      .acc-stats { margin: 0 0 20px; }
      .acc-quick-grid { gap: 14px; }
      .acc-quick { --acc-quick-pad: 16px; min-height: 120px; }
      .acc-row { min-height: 76px; }
      .acc-detail-card { padding: 6px 18px; }
    }

    @media (min-width: 1280px) {
      .acc-app { max-width: 1200px; }
      .acc-layout { grid-template-columns: 320px minmax(0, 1fr); gap: 36px; }
      .acc-quick-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .acc-quick strong { font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ── My Orders — content inside the shared account shell ── */
    :root {
      --ord-green: #14532d;
      --ord-green-dark: #0f3d22;
      --ord-text: #1a1a1a;
      --ord-muted: #6b7280;
      --ord-border: rgba(21, 83, 45, .12);
      --ord-radius: 14px;
    }

    .acc-content .ord-surface {
      margin-top: 2px;
      background: #f7f9f2;
      border: 1px solid rgba(21, 83, 45, .08);
      border-radius: var(--acc-radius);
      box-shadow: var(--acc-shadow);
    }

    .ord-search-row { padding: 14px 14px 4px; }
    .ord-search-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 13px;
      background: #fff;
      border: 1px solid var(--acc-line);
      border-radius: 12px;
      box-shadow: var(--acc-shadow);
    }
    .ord-search-wrap i { color: var(--acc-leaf); font-size: 14px; }
    .ord-search-wrap input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 13.5px;
      color: var(--acc-ink);
    }
    .ord-search-wrap input::placeholder { color: #9ca3af; }

    .ord-tabs { gap: 7px; padding: 10px 14px 14px; }
    .ord-tab {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--acc-line);
      background: #fff;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--acc-muted);
    }
    .ord-tab.active {
      background: var(--acc-forest);
      border-color: var(--acc-forest);
      color: #fff;
    }

    .ord-list { gap: 12px; padding: 0 14px 14px; margin-top: 0; }
    .ord-card {
      background: #fff;
      border: 1px solid var(--acc-line);
      border-radius: var(--acc-radius);
      box-shadow: var(--acc-shadow);
      padding: 12px;
    }
    .ord-card-top { margin-bottom: 10px; }
    .ord-status { border-radius: 999px; font-weight: 700; }
    .ord-status--processing { background: #e8f3e7; color: var(--acc-forest); }
    .ord-status--accepted,
    .ord-status--packed,
    .ord-status--on-the-way { background: #eef5ee; color: var(--acc-leaf); }
    .ord-status--delivered { background: #dcfce7; color: #15803d; }
    .ord-status--cancelled { background: #fee2e2; color: #b42318; }
    .ord-card-img { border-radius: 11px; background: #f3f7f1; }
    .ord-card-buttons {
      margin: 10px -12px -12px;
      padding: 10px 12px;
      background: transparent;
      border-top: 1px solid var(--acc-line);
      border-radius: 0 0 var(--acc-radius) var(--acc-radius);
    }
    .ord-btn-details {
      background: var(--acc-forest);
      border: 1px solid var(--acc-forest);
      border-radius: 10px;
      padding: 8px 18px;
      font-weight: 700;
    }
    .ord-btn-details:hover { background: var(--acc-forest-dark); }

    .ord-empty {
      margin: 0 14px 14px;
      padding: 36px 18px;
      background: #fff;
      border: 1px solid var(--acc-line);
      border-radius: var(--acc-radius);
      box-shadow: var(--acc-shadow);
    }
    .ord-empty-icon { background: linear-gradient(135deg, #e8f3e7, #d5e9cf); }
    .ord-shop-btn {
      background: var(--acc-forest);
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(20, 83, 45, .18);
      font-weight: 750;
    }

    .ord-modal-overlay { z-index: 1100; }
    .ord-modal { border-radius: var(--acc-radius) var(--acc-radius) 0 0; }
    .ord-modal-footer-total { color: var(--acc-forest); }
    .ord-modal-address { background: #f3f9f1; border-color: var(--acc-line); }

  <script>
    (function () {
      // Shared account-shell behaviour: active bottom nav + cart badge.
      var accountNav = document.querySelector('.mobile-bottom-nav-global [data-nav-key="account"]');
      if (accountNav) {
        accountNav.classList.add('active');
        accountNav.setAttribute('aria-current', 'page');
      }
      function readJSON(key) {
        try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) { return []; }
      }
      function readData(key) {
        try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; }
      }
      function setText(selector, value) {
        var el = document.querySelector(selector);
        if (el && value) el.textContent = value;
      }
      function initials(name) {
        var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
        if (!parts.length) return 'VP';
        return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
      }
      var DEFAULT_AVATAR = 'assets-ui/img/default-avatar.svg';
      function setAvatar(src) {
        var el = document.querySelector('#acc-avatar');
        if (!el) return;
        var img = document.createElement('img');
        img.src = src || DEFAULT_AVATAR;
        img.alt = '';
        el.innerHTML = '';
        el.appendChild(img);
      }

      var user = readData('vpnexuesUser') || readData('loggedInUser') || readData('currentUser') || {};
      var profile = readData('vpnexues_profile') || {};
      var name = profile.fullName
        || localStorage.getItem('vpnexues_userName')
        || localStorage.getItem('vpnexuesName')
        || user.name
        || user.fullName
        || '';
      var email = profile.email
        || localStorage.getItem('vpnexues_userEmail')
        || localStorage.getItem('vpnexuesEmail')
        || user.email
        || '';
      var displayName = String(name || '').trim().replace(/\s+/g, ' ');
      var displayEmail = String(email || '').trim();
      var picture = profile.picture || user.picture || user.photo || '';

      if (displayName) setText('#acc-greeting', 'Welcome back, ' + displayName + '!');
      setAvatar(picture, displayName);
      if (displayEmail) setText('#acc-email', displayEmail);

      var cart = readJSON('cart');
      var cartCount = 0;
      cart.forEach(function (item) { cartCount += (item.qty || item.quantity || 1); });
      ['acc-cart-badge', 'nav-cart-badge'].forEach(function (id) {
        var badge = document.getElementById(id);
        if (!badge) return;
        badge.textContent = String(cartCount || 3);
        badge.style.display = '';
      });

      // Sidebar links point back into the dashboard views on account.html.
      document.querySelectorAll('.acc-nav-item[data-view]').forEach(function (item) {
        item.addEventListener('click', function (e) {
          var view = item.getAttribute('data-view');
          if (view === 'orders') return; // already here
          e.preventDefault();
          window.location.href = 'account.html#' + view;
        });
      });
      document.querySelectorAll('.acc-nav-toggle[data-toggle]').forEach(function (toggle) {
        toggle.addEventListener('click', function (e) {
          e.preventDefault();
          window.location.href = 'account.html#' + toggle.getAttribute('data-toggle');
        });
      });
      document.querySelectorAll('.acc-subitem[data-detail]').forEach(function (sub) {
        sub.addEventListener('click', function (e) {
          e.preventDefault();
          window.location.href = 'account.html#detail-' + sub.getAttribute('data-detail');
        });
      });
    })();
  </script>

  <script>
    (function () {
      'use strict';

      var ORDERS_KEY = 'vpnexues_orders';
      var activeFilter = 'all';
      var searchQuery = '';

      function getOrders() {
        try {
          return JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]');
        } catch (e) {
          return [];
        }
      }

      function saveOrders(orders) {
        localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
      }

      function addOrder(order) {
        var orders = getOrders();
        order.id = 'ORD-' + Date.now();
        order.date = new Date().toISOString();
        order.status = order.status || 'processing';
        orders.unshift(order);
        saveOrders(orders);
        return order;
      }

      window.VpnOrders = {
        getOrders: getOrders,
        addOrder: addOrder,
        saveOrders: saveOrders
      };

      window.deleteOrder = function(orderId) {
        if (!confirm('Are you sure you want to delete this order?')) return;
        var orders = getOrders();
        orders = orders.filter(function(order) { return order.id !== orderId; });
        saveOrders(orders);
        renderOrders();
      };

      function formatDate(dateStr) {
        var d = new Date(dateStr);
        var day = d.getDate();
        var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        var month = months[d.getMonth()];
        var year = d.getFullYear();
        var hours = d.getHours();
        var mins = d.getMinutes();
        var ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        var minsStr = mins < 10 ? '0' + mins : mins;
        return day + ' ' + month + ', ' + year + ' \u2022 ' + hours + ':' + minsStr + ' ' + ampm;
      }

      function getStatusLabel(status) {
        var s = status || 'processing';
        return s.charAt(0).toUpperCase() + s.slice(1);
      }

      function getItemsText(items) {
        if (!items || items.length === 0) return '';
        var names = items.map(function(item) { return item.name || ''; }).filter(Boolean);
        if (names.length <= 2) return names.join(', ');
        return names.slice(0, 2).join(', ') + ' & ' + (names.length - 2) + ' more';
      }

      function getFirstImage(items) {
        if (!items || items.length === 0) return null;
        for (var i = 0; i < items.length; i++) {
          if (items[i].image) return items[i].image;
        }
        return null;
      }

      function matchesFilter(order) {
        if (activeFilter === 'all') return true;
        return (order.status || 'processing') === activeFilter;
      }

      function matchesSearch(order) {
        if (!searchQuery) return true;
        var q = searchQuery.toLowerCase();
        if (order.storeName && order.storeName.toLowerCase().indexOf(q) !== -1) return true;
        if (order.name && order.name.toLowerCase().indexOf(q) !== -1) return true;
        if (order.id && order.id.toLowerCase().indexOf(q) !== -1) return true;
        var items = order.items || [];
        for (var i = 0; i < items.length; i++) {
          if (items[i].name && items[i].name.toLowerCase().indexOf(q) !== -1) return true;
        }
        return false;
      }

      /* �”€�”€�”€ Modal �”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€ */
      function openOrderModal(orderId) {
        var orders = getOrders();
        var order = null;
        for (var i = 0; i < orders.length; i++) {
          if (orders[i].id === orderId) { order = orders[i]; break; }
        }
        if (!order) return;

        var overlay = document.getElementById('ord-modal-overlay');
        var body = document.getElementById('ord-modal-body');
        var totalEl = document.getElementById('ord-modal-footer-total');
        if (!overlay || !body || !totalEl) return;

        var statusClass = 'ord-status--' + (order.status || 'processing');
        var statusLabel = getStatusLabel(order.status);
        var items = order.items || [];
        var description = order.description || '';
        var total = order.total || 0;

        var itemsHtml = items.map(function(item) {
          var qty = item.qty || item.quantity || 1;
          var price = item.price || 0;
          var itemTotal = price * qty;
          var imgHtml = item.image
            ? '<img src="' + item.image + '" alt="' + (item.name || '') + '">'
            : '<i class="fas fa-box"></i>';

          return '<div class="ord-modal-item">' +
            '<div class="ord-modal-item-img">' + imgHtml + '</div>' +
            '<div class="ord-modal-item-info">' +
              '<div class="ord-modal-item-name">' + (item.name || 'Item') + '</div>' +
              '<div class="ord-modal-item-qty">Qty: ' + qty + ' &times; &#x20B9;' + price.toFixed(2) + '</div>' +
            '</div>' +
            '<div class="ord-modal-item-price">&#x20B9;' + itemTotal.toFixed(2) + '</div>' +
          '</div>';
        }).join('');

        var html = '';
        html += '<div class="ord-modal-meta">';
        html += '  <span class="ord-status ' + statusClass + '">' + statusLabel + '</span>';
        html += '  <span class="ord-modal-meta-date">' + formatDate(order.date) + '</span>';
        html += '</div>';
        
        // Status Timeline
        var statuses = ['processing', 'accepted', 'packed', 'on-the-way', 'delivered'];
        var currentIdx = statuses.indexOf(order.status || 'processing');
        if (order.status === 'failed' || order.status === 'cancelled') currentIdx = -1;
        html += '<div class="ord-timeline">';
        statuses.forEach(function(s, i) {
          var done = i <= currentIdx;
          var active = i === currentIdx;
          var label = s.replace(/-/g,' ').replace(/\b\w/g,function(l){return l.toUpperCase()});
          html += '<div class="ord-timeline-step ' + (done ? 'done' : '') + ' ' + (active ? 'active' : '') + '">';
          html += '  <div class="ord-timeline-dot"><i class="fas ' + (done ? 'fa-check' : 'fa-circle') + '"></i></div>';
          html += '  <div class="ord-timeline-label">' + label + '</div>';
          html += '</div>';
        });
        html += '</div>';
        
        if (description) {
          html += '<div class="ord-modal-desc">' + description + '</div>';
        }
        html += '<div class="ord-modal-items-label">Items (' + items.length + ')</div>';
        html += itemsHtml;

        if (order.address) {
          html += '<div class="ord-modal-address">';
          html += '<div class="ord-modal-address-title"><i class="fas fa-map-marker-alt"></i> Delivery Address</div>';
          html += '<div class="ord-modal-address-text">' + (order.address.address || '') + '</div>';
          if (order.address.flat) {
            html += '<div class="ord-modal-address-text">Flat/House: ' + order.address.flat + '</div>';
          }
          if (order.address.phone) {
            html += '<div class="ord-modal-address-contact"><i class="fas fa-phone" style="margin-right:4px;"></i>' + order.address.phone + '</div>';
          }
          html += '</div>';
        }

        body.innerHTML = html;
        totalEl.innerHTML = '\u20B9' + total.toFixed(2);

        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeOrderModal() {
        var overlay = document.getElementById('ord-modal-overlay');
        if (overlay) {
          overlay.classList.remove('open');
          document.body.style.overflow = '';
        }
      }

      window.openOrderModal = openOrderModal;
      window.closeOrderModal = closeOrderModal;

      /* �”€�”€�”€ Render �”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€ */
      function renderOrders() {
        var listEl = document.getElementById('ord-list');
        var emptyEl = document.getElementById('ord-empty');
        if (!listEl || !emptyEl) return;

        var orders = getOrders().filter(matchesFilter).filter(matchesSearch);

        if (orders.length === 0) {
          listEl.style.display = 'none';
          emptyEl.style.display = '';
          return;
        }

        listEl.style.display = '';
        emptyEl.style.display = 'none';

        listEl.innerHTML = orders.map(function (order) {
          var statusClass = 'ord-status--' + (order.status || 'processing');
          var statusLabel = getStatusLabel(order.status);
          var totalItems = (order.items || []).reduce(function (sum, item) {
            return sum + (item.qty || item.quantity || 1);
          }, 0);
          var firstImage = getFirstImage(order.items);
          var itemsText = getItemsText(order.items);
          var storeName = order.storeName || order.name || 'Order';
          var deliveryTime = order.deliveryTime || '';

          var imgHtml = firstImage
            ? '<img src="' + firstImage + '" alt="' + storeName + '">'
            : '<i class="fas fa-box"></i>';

          var buttonsHtml = '';
          buttonsHtml = '<button class="ord-btn ord-btn-details" onclick="openOrderModal(\'' + order.id + '\')">View Details</button>';

          var deliveryHtml = '';
          if (order.status === 'cancelled') {
            deliveryHtml = '<div class="ord-card-delivery"><i class="fas fa-ban"></i> Cancelled</div>';
          } else if (deliveryTime) {
            deliveryHtml = '<div class="ord-card-delivery"><i class="far fa-clock"></i> ' + deliveryTime + '</div>';
          }

          return '<div class="ord-card" data-order-id="' + order.id + '">' +
            '<div class="ord-card-top">' +
              '<span class="ord-status ' + statusClass + '">' + statusLabel + '</span>' +
              '<div class="ord-card-top-right">' +
                '<span class="ord-card-date">' + formatDate(order.date) + '</span>' +
                '<button class="ord-more-btn" onclick="deleteOrder(\'' + order.id + '\')" title="Delete order"><i class="fas fa-trash-alt"></i></button>' +
              '</div>' +
            '</div>' +
              '<div class="ord-card-body">' +
              '<div class="ord-card-img">' + imgHtml + '</div>' +
              '<div class="ord-card-info">' +
                '<div class="ord-card-name">' + storeName + '</div>' +
                (itemsText ? '<div class="ord-card-items-text">' + itemsText + '</div>' : '') +
                deliveryHtml +
              '</div>' +
            '</div>' +
            '<div class="ord-card-buttons">' + buttonsHtml + '</div>' +
          '</div>';
        }).join('');
      }

      /* �”€�”€�”€ Init �”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€�”€ */
      document.addEventListener('DOMContentLoaded', function() {
        renderOrders();

        var tabs = document.querySelectorAll('.ord-tab');
        tabs.forEach(function(tab) {
          tab.addEventListener('click', function() {
            tabs.forEach(function(t) { t.classList.remove('active'); });
            tab.classList.add('active');
            activeFilter = tab.getAttribute('data-filter');
            renderOrders();
          });
        });

        var searchInput = document.getElementById('ord-search');
        if (searchInput) {
          var debounce;
          searchInput.addEventListener('input', function() {
            clearTimeout(debounce);
            debounce = setTimeout(function() {
              searchQuery = searchInput.value.trim();
              renderOrders();
            }, 250);
          });
        }

        var modalClose = document.getElementById('ord-modal-close');
        if (modalClose) {
          modalClose.addEventListener('click', closeOrderModal);
        }

        var modalOverlay = document.getElementById('ord-modal-overlay');
        if (modalOverlay) {
          modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) closeOrderModal();
          });
        }
      });

      function updateCartBadge() {
        var badge = document.getElementById('nav-cart-badge');
        if (badge) {
          var cart;try{cart=JSON.parse(localStorage.getItem('cart')||'[]')}catch(e){cart=[]}
          var count = 0;
          cart.forEach(function (item) { count += (item.qty || item.quantity || 1); });
          if (count > 0) {
            badge.textContent = count;
            badge.style.display = '';
          } else {
            badge.style.display = 'none';
          }
        }
      }
      updateCartBadge();
      window.updateCartBadge = updateCartBadge;

    })();
  </script>

  <script id="broken-image-hide">document.addEventListener("error",function(e){if(e.target.tagName==="IMG"){e.target.style.setProperty("display","none","important");var c=e.target.closest(".bb-item-img,.box-icon-only,.bb-mobile-image-wrap,.sb-mobile-product-card,.prd-img,.product-image,.image-box");if(c){c.classList.add("img-load-failed");var ic=c.querySelector(".box-product-icon");if(ic){ic.style.setProperty("display","flex","important");ic.style.alignItems="center";ic.style.justifyContent="center";ic.style.width="100%";ic.style.height="100%";ic.style.fontSize="44px";}}}},true);</script>
